name: breaking-news-bot

on:
  schedule:
    # cron è SEMPRE in UTC: lancio ogni ora dalle 07 alle 21 UTC e lascio che
    # news_bot.py filtri le ore di Roma (slot 9, 12, 15, 18, 21 con tolleranza).
    # Minuto :11 e non :00 per evitare la ressa in cima all'ora (ritardi minori).
    - cron: "11 7-21 * * *"

  # Avvio manuale dal sito (tab "Actions" -> "Run workflow").
  # Spuntando "prova" si invia al canale di test invece che a quello normale.
  workflow_dispatch:
    inputs:
      prova:
        description: "Esecuzione di prova (invia al canale di test)"
        type: boolean
        default: false

permissions:
  contents: write                # serve per ricommittare i file di stato

concurrency:
  group: news-bot                # niente due esecuzioni sovrapposte
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa le dipendenze
        run: pip install -r requirements.txt

      - name: Esegui il bot
        env:
          DISCORD_WEBHOOK:       ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_WEBHOOK_PROVA: ${{ secrets.DISCORD_WEBHOOK_PROVA }}
          NOTIZIE_ROLE_ID:       ${{ secrets.NOTIZIE_ROLE_ID }}
        run: |
          if [ "${{ inputs.prova }}" = "true" ]; then
            python news_bot.py --prova
          else
            python news_bot.py
          fi

      # Salva lo stato in ENTRAMBE le modalità: il run normale aggiorna
      # gia_postati.json, la prova aggiorna gia_postati_prova.json.
      # 'git add -A' mette in staging solo il file che è davvero cambiato.
      - name: Salva lo stato (URL già postati)
        run: |
          git config user.name  "news-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "stato: aggiorno le notizie postate" || echo "niente da committare"
          git push
